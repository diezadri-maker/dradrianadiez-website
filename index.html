<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Dr. Adriana Diez, PhD — Neuroscientist, Researcher, and Hypnosis Practitioner. Helping you explore meaningful change with curiosity, evidence, and reflection."
    >

    <title>Dr. Adriana Diez, PhD</title>

    <style>
        :root {
            --background: #fbf8f3;
            --surface: rgba(255, 255, 255, 0.72);
            --navy: #263b67;
            --purple: #6a4f8f;
            --gold: #b48a3c;
            --text: #342d2a;
            --muted: #776d68;
            --border: rgba(180, 138, 60, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(106, 79, 143, 0.09),
                    transparent 34%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(38, 59, 103, 0.08),
                    transparent 38%
                ),
                var(--background);
            color: var(--text);
            font-family:
                Georgia,
                "Times New Roman",
                serif;
            text-align: center;
        }

        .page {
            width: 100%;
            max-width: 860px;
        }

        .card {
            padding: 72px 56px 58px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow:
                0 24px 70px rgba(38, 59, 103, 0.08);
            backdrop-filter: blur(8px);
        }

        .monogram {
            width: 68px;
            height: 68px;
            margin: 0 auto 30px;
            display: grid;
            place-items: center;
            border: 1px solid var(--gold);
            border-radius: 50%;
            color: var(--purple);
            font-size: 1.45rem;
            letter-spacing: 0.05em;
        }

        h1 {
            margin: 0;
            color: var(--navy);
            font-size: clamp(2.5rem, 7vw, 4.6rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -0.035em;
        }

        .gold-line {
            width: 76px;
            height: 2px;
            margin: 28px auto;
            background: var(--gold);
        }

        .credentials {
            margin: 0;
            color: var(--purple);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            font-size: 0.86rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            line-height: 1.9;
            text-transform: uppercase;
        }

        .mission {
            max-width: 650px;
            margin: 42px auto 0;
            font-size: clamp(1.2rem, 3vw, 1.55rem);
            line-height: 1.75;
        }

        .contact {
            margin-top: 46px;
            padding-top: 34px;
            border-top: 1px solid var(--border);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .email {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--navy);
            font-size: 1rem;
            text-decoration: none;
            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .email:hover {
            color: var(--purple);
            transform: translateY(-1px);
        }

        .coming-soon {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 0.92rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .closing-note {
            margin: 34px 0 0;
            color: var(--gold);
            font-size: 0.95rem;
            font-style: italic;
        }

        @media (max-width: 640px) {
            body {
                padding: 18px;
            }

            .card {
                padding: 52px 24px 42px;
                border-radius: 22px;
            }

            .credentials {
                font-size: 0.76rem;
                letter-spacing: 0.15em;
            }

            .credentials span {
                display: block;
            }

            .credentials .divider {
                display: none;
            }

            .mission {
                margin-top: 34px;
            }

            .email {
                font-size: 0.94rem;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card" aria-labelledby="page-title">

            <div class="monogram" aria-hidden="true">
                AD
            </div>

            <h1 id="page-title">
                Dr. Adriana Diez, PhD
            </h1>

            <div class="gold-line" aria-hidden="true"></div>

            <p class="credentials">
                <span>Neuroscientist</span>
                <span class="divider">&nbsp; | &nbsp;</span>
                <span>Researcher</span>
                <span class="divider">&nbsp; | &nbsp;</span>
                <span>Hypnosis Practitioner</span>
            </p>

            <p class="mission">
                Helping you explore meaningful change with curiosity,
                evidence, and reflection.
            </p>

            <div class="contact">
                <a
                    class="email"
                    href="mailto:connect@dradrianadiez.com"
                    aria-label="Email Dr. Adriana Diez"
                >
                    <span aria-hidden="true">✉</span>
                    <span>connect@dradrianadiez.com</span>
                </a>

                <p class="coming-soon">
                    Website coming soon
                </p>

                <p class="closing-note">
                    A thoughtful space is taking shape.
                </p>
            </div>

        </section>
    </main>
</body>
</html>
